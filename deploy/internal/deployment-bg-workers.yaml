apiVersion: apps/v1
kind: Deployment
metadata:
  name: noobaa-bg-workers
  labels:
    app: noobaa
spec:
  replicas: 1
  selector:
    matchLabels:
      noobaa-bg-workers: noobaa
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: noobaa
        noobaa-bg-workers: noobaa
        noobaa-component: bg-workers
      annotations:
        noobaa.io/configmap-hash: ""
        openshift.io/required-scc: noobaa-core
    spec:
      serviceAccountName: noobaa-core
      volumes:
        - name: mgmt-secret
          secret:
            secretName: noobaa-mgmt-serving-cert
            optional: true
        - name: bg-workers-secret
          secret:
            secretName: noobaa-bg-workers-serving-cert
            optional: true
        - name: noobaa-server
          secret:
            secretName: noobaa-server
            optional: true
        - name: bound-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: openshift
      securityContext:
        runAsUser: 10001
        runAsGroup: 0
      containers:
        - name: bg-workers
          image: NOOBAA_CORE_IMAGE
          terminationMessagePolicy: FallbackToLogsOnError
          command:
            # Upgrade: OLM can start this operator while the old core image is
            # still running. That image has no bg_init.js. Sleep instead of
            # CrashLoop until the core image rolls.
            - /bin/bash
            - -ec
            - |
              if [ -f /root/node_modules/noobaa-core/src/cmd/bg_init.js ]; then
                exec /usr/local/bin/node /root/node_modules/noobaa-core/src/cmd/bg_init.js
              fi
              echo "bg_init.js missing (old core image); sleeping until the image is updated"
              exec sleep infinity
          readinessProbe:
            tcpSocket:
              port: 8445
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: mgmt-secret
              mountPath: /etc/mgmt-secret
              readOnly: true
            - name: bg-workers-secret
              mountPath: /etc/bg-secret
              readOnly: true
            - name: noobaa-server
              mountPath: /etc/noobaa-server
              readOnly: true
            - name: bound-sa-token
              mountPath: /var/run/secrets/openshift/serviceaccount
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "3Gi"
          ports:
            - containerPort: 8445
              name: bg-https
            - containerPort: 7002
              name: metrics
          env:
            - name: NOOBAA_BG_ROLE
              value: scanner
            - name: NOOBAA_DISABLE_COMPRESSION
              valueFrom:
                configMapKeyRef:
                  name: noobaa-config
                  key: NOOBAA_DISABLE_COMPRESSION
            - name: NOOBAA_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: noobaa-config
                  key: NOOBAA_LOG_LEVEL
            - name: NOOBAA_LOG_COLOR
              valueFrom:
                configMapKeyRef:
                  name: noobaa-config
                  key: NOOBAA_LOG_COLOR
            - name: NOOBAA_METRICS_AUTH_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: noobaa-config
                  key: NOOBAA_METRICS_AUTH_ENABLED
            - name: MGMT_ADDR
            - name: BG_ADDR
            - name: MD_ADDR
            - name: HOSTED_AGENTS_ADDR
            - name: POSTGRES_HOST
            - name: POSTGRES_HOST_RO
            - name: POSTGRES_PORT
            - name: POSTGRES_DBNAME
            - name: POSTGRES_USER
            - name: POSTGRES_PASSWORD
            - name: POSTGRES_CONNECTION_STRING
            - name: POSTGRES_SSL_REQUIRED
            - name: POSTGRES_SSL_UNAUTHORIZED
            - name: POSTGRES_HOST_PATH
            - name: POSTGRES_USER_PATH
            - name: POSTGRES_PASSWORD_PATH
            - name: POSTGRES_DBNAME_PATH
            - name: POSTGRES_PORT_PATH
            - name: POSTGRES_CONNECTION_STRING_PATH
            - name: DB_TYPE
              value: postgres
            - name: CONTAINER_PLATFORM
              value: KUBERNETES
            - name: NODE_EXTRA_CA_CERTS
            - name: TLS_MIN_VERSION
            - name: TLS_CIPHERS
            - name: TLS_GROUPS
            - name: CONTAINER_CPU_REQUEST
              valueFrom:
                resourceFieldRef:
                  resource: requests.cpu
            - name: CONTAINER_MEM_REQUEST
              valueFrom:
                resourceFieldRef:
                  resource: requests.memory
            - name: CONTAINER_CPU_LIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
            - name: CONTAINER_MEM_LIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
          envFrom:
            - configMapRef:
                name: noobaa-config
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
