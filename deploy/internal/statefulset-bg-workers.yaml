apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: noobaa-bg-workers
  labels:
    app: noobaa
spec:
  replicas: 1
  selector:
    matchLabels:
      noobaa-bg-workers: noobaa
  serviceName: noobaa-bg-workers
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: noobaa
        noobaa-bg-workers: noobaa
        noobaa-component: bg-workers
      annotations:
        noobaa.io/configmap-hash: ""
        openshift.io/required-scc: noobaa-core
    spec:
      serviceAccountName: noobaa-core
      volumes:
        # Shared by bg-workers + noobaa-log-processor for BEST_EFFORT bucket log staging.
        - name: logs
          emptyDir: {}
        - name: mgmt-secret
          secret:
            secretName: noobaa-mgmt-serving-cert
            optional: true
        - name: bg-workers-secret
          secret:
            secretName: noobaa-bg-workers-serving-cert
            optional: true
        - name: noobaa-server
          secret:
            secretName: noobaa-server
            optional: true
        - name: bound-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: openshift
      securityContext:
        runAsUser: 10001
        runAsGroup: 0
      containers:
        - name: bg-workers
          image: NOOBAA_CORE_IMAGE
          terminationMessagePolicy: FallbackToLogsOnError
          command:
            - /usr/local/bin/node
            - --unhandled-rejections=warn
            - /root/node_modules/noobaa-core/src/server/bg_workers.js
          readinessProbe:
            tcpSocket:
              port: 8445
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: logs
              mountPath: /log
            - name: mgmt-secret
              mountPath: /etc/mgmt-secret
              readOnly: true
            - name: bg-workers-secret
              mountPath: /etc/bg-secret
              readOnly: true
            - name: noobaa-server
              mountPath: /etc/noobaa-server
              readOnly: true
            - name: bound-sa-token
              mountPath: /var/run/secrets/openshift/serviceaccount
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "999m"
              memory: "3Gi"
          ports:
            - containerPort: 8445
              name: bg-https
            - containerPort: 9445
              name: metrics-https
          env:
            - name: BG_WORKERS_MODE
              value: default
            - name: NOOBAA_DISABLE_COMPRESSION
              valueFrom:
                configMapKeyRef:
                  name: noobaa-config
                  key: NOOBAA_DISABLE_COMPRESSION
            - name: NOOBAA_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: noobaa-config
                  key: NOOBAA_LOG_LEVEL
            - name: NOOBAA_LOG_COLOR
              valueFrom:
                configMapKeyRef:
                  name: noobaa-config
                  key: NOOBAA_LOG_COLOR
            - name: NOOBAA_METRICS_AUTH_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: noobaa-config
                  key: NOOBAA_METRICS_AUTH_ENABLED
            - name: MGMT_ADDR
            - name: BG_ADDR
            - name: MD_ADDR
            - name: HOSTED_AGENTS_ADDR
            - name: POSTGRES_HOST
            - name: POSTGRES_HOST_RO
            - name: POSTGRES_PORT
            - name: POSTGRES_DBNAME
            - name: POSTGRES_USER
            - name: POSTGRES_PASSWORD
            - name: POSTGRES_CONNECTION_STRING
            - name: POSTGRES_SSL_REQUIRED
            - name: POSTGRES_SSL_UNAUTHORIZED
            - name: POSTGRES_HOST_PATH
            - name: POSTGRES_USER_PATH
            - name: POSTGRES_PASSWORD_PATH
            - name: POSTGRES_DBNAME_PATH
            - name: POSTGRES_PORT_PATH
            - name: POSTGRES_CONNECTION_STRING_PATH
            - name: GUARANTEED_LOGS_PATH
            - name: DB_TYPE
              value: postgres
            - name: CONTAINER_PLATFORM
              value: KUBERNETES
            - name: NODE_EXTRA_CA_CERTS
            - name: TLS_MIN_VERSION
            - name: TLS_CIPHERS
            - name: TLS_GROUPS
            - name: CONTAINER_CPU_REQUEST
              valueFrom:
                resourceFieldRef:
                  resource: requests.cpu
            - name: CONTAINER_MEM_REQUEST
              valueFrom:
                resourceFieldRef:
                  resource: requests.memory
            - name: CONTAINER_CPU_LIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
            - name: CONTAINER_MEM_LIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
            - name: NOTIFICATION_LOG_DIR
              value: ""
          envFrom:
            - configMapRef:
                name: noobaa-config
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
        - name: noobaa-log-processor
          image: NOOBAA_CORE_IMAGE
          terminationMessagePolicy: FallbackToLogsOnError
          command:
            [
              "/root/node_modules/noobaa-core/src/deploy/NVA_build/noobaa_logs.sh",
            ]
          volumeMounts:
            - name: logs
              mountPath: /log
          resources:
            requests:
              cpu: "200m"
              memory: "500Mi"
            limits:
              cpu: "200m"
              memory: "500Mi"
          ports:
            - containerPort: 5140
          env:
            - name: CONTAINER_CPU_REQUEST
              valueFrom:
                resourceFieldRef:
                  resource: requests.cpu
            - name: CONTAINER_MEM_REQUEST
              valueFrom:
                resourceFieldRef:
                  resource: requests.memory
            - name: CONTAINER_CPU_LIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
            - name: CONTAINER_MEM_LIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
