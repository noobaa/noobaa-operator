apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: noobaa-bg-workers
  labels:
    app: noobaa
spec:
  podSelector:
    matchLabels:
      noobaa-bg-workers: noobaa
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8445
  # Prometheus scrapes :7002 from a monitoring namespace (same as core 8443 / db 9187 / endpoint 9443).
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 7002
