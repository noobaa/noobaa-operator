apiVersion: v1
kind: Service
metadata:
  name: tables
  labels:
    app: noobaa
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: 'noobaa-tables-serving-cert'
    service.alpha.openshift.io/serving-cert-secret-name: 'noobaa-tables-serving-cert'
spec:
  type: LoadBalancer
  selector:
    noobaa-s3: SYSNAME
  ports:
    - port: 443
      targetPort: 15443
      name: tables-https
