apiVersion: apps/v1
kind: Deployment
metadata:
  name: noobaa-bg-executors
  labels:
    app: noobaa
spec:
  replicas: 1
  selector:
    matchLabels:
      noobaa-bg-executors: noobaa
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: noobaa
        noobaa-bg-executors: noobaa
        noobaa-component: bg-executors
      annotations:
        noobaa.io/configmap-hash: ""
        openshift.io/required-scc: noobaa-bg-executors
    spec:
      # Dedicated executor SCC/SA. SCC is the endpoint profile; RBAC is the core role.
      serviceAccountName: noobaa-bg-executors
      volumes:
        - name: mgmt-secret
          secret:
            secretName: noobaa-mgmt-serving-cert
            optional: true
        - name: noobaa-server
          secret:
            secretName: noobaa-server
            optional: true
        - name: bound-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: openshift
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: bg-executors
          image: NOOBAA_CORE_IMAGE
          terminationMessagePolicy: FallbackToLogsOnError
          command:
            - /usr/local/bin/node
            - --unhandled-rejections=warn
            - /root/node_modules/noobaa-core/src/server/bg_workers.js
          volumeMounts:
            - name: mgmt-secret
              mountPath: /etc/mgmt-secret
              readOnly: true
            - name: noobaa-server
              mountPath: /etc/noobaa-server
              readOnly: true
            - name: bound-sa-token
              mountPath: /var/run/secrets/openshift/serviceaccount
              readOnly: true
          securityContext:
            capabilities:
              add: ["SETUID", "SETGID"]
          # empty readyness probe
          readinessProbe:
            exec:
              command: ["true"]
            initialDelaySeconds: 1
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "500Mi"
            limits:
              cpu: "999m"
              memory: "3Gi"
          env:
            - name: BG_WORKERS_MODE
              value: executor
            - name: NOOBAA_DISABLE_COMPRESSION
              valueFrom:
                configMapKeyRef:
                  name: noobaa-config
                  key: NOOBAA_DISABLE_COMPRESSION
            - name: NOOBAA_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: noobaa-config
                  key: NOOBAA_LOG_LEVEL
            - name: NOOBAA_LOG_COLOR
              valueFrom:
                configMapKeyRef:
                  name: noobaa-config
                  key: NOOBAA_LOG_COLOR
            - name: NOOBAA_METRICS_AUTH_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: noobaa-config
                  key: NOOBAA_METRICS_AUTH_ENABLED
            - name: MGMT_ADDR
            - name: BG_ADDR
            - name: MD_ADDR
            - name: HOSTED_AGENTS_ADDR
            - name: POSTGRES_HOST
            - name: POSTGRES_HOST_RO
            - name: POSTGRES_PORT
            - name: POSTGRES_DBNAME
            - name: POSTGRES_USER
            - name: POSTGRES_PASSWORD
            - name: POSTGRES_CONNECTION_STRING
            - name: POSTGRES_SSL_REQUIRED
            - name: POSTGRES_SSL_UNAUTHORIZED
            - name: POSTGRES_HOST_PATH
            - name: POSTGRES_USER_PATH
            - name: POSTGRES_PASSWORD_PATH
            - name: POSTGRES_DBNAME_PATH
            - name: POSTGRES_PORT_PATH
            - name: POSTGRES_CONNECTION_STRING_PATH
            - name: GUARANTEED_LOGS_PATH
            - name: DB_TYPE
              value: postgres
            - name: CONTAINER_PLATFORM
              value: KUBERNETES
            - name: NODE_EXTRA_CA_CERTS
            - name: TLS_MIN_VERSION
            - name: TLS_CIPHERS
            - name: TLS_GROUPS
            - name: CONTAINER_CPU_REQUEST
              valueFrom:
                resourceFieldRef:
                  resource: requests.cpu
            - name: CONTAINER_MEM_REQUEST
              valueFrom:
                resourceFieldRef:
                  resource: requests.memory
            - name: CONTAINER_CPU_LIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
            - name: CONTAINER_MEM_LIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
            - name: NOTIFICATION_LOG_DIR
              value: ""
          envFrom:
            - configMapRef:
                name: noobaa-config
